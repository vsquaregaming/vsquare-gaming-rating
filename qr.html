<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review QR Poster</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  body { margin: 0; font-family: "Space Grotesk", sans-serif; background: #eee; display: flex; flex-direction: column; align-items: center; padding: 20px 16px; }
  .controls { display: flex; gap: 8px; width: 100%; max-width: 520px; margin-bottom: 20px; }
  .controls input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; }
  .controls button { padding: 10px 16px; border: 0; border-radius: 8px; background: #ffd23f; color: #1a1500; font-weight: 700; cursor: pointer; }
  .poster {
    width: 100%; max-width: 420px; background: #0b0b14; color: #fff; border-radius: 24px;
    padding: 32px 24px; text-align: center;
    background-color: #0f1013; background-image: radial-gradient(rgba(255,255,255,.05) 1px, transparent 1px); background-size: 18px 18px;
  }
  .logo { display: inline-flex; align-items: center; gap: 10px; font: 700 14px "JetBrains Mono", monospace; letter-spacing: 3px; }
  .mark { width: 38px; height: 38px; border-radius: 10px; background: #ffd23f; color: #1a1500; display: grid; place-items: center; font-size: 18px; letter-spacing: -1px; }
  h2 { margin: 22px 0 6px; font-size: 30px; letter-spacing: -.5px; }
  .stars { color: #ffd23f; font-size: 30px; letter-spacing: 6px; }
  #qr { background: #fff; display: inline-block; padding: 14px; border-radius: 16px; margin: 18px 0 12px; }
  .small { color: #b8b8d8; font-size: 14px; }
  @media print {
    body { background: #fff; padding: 0; }
    .controls { display: none; }
    .poster { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
  <div class="controls">
    <input id="url" placeholder="Your deployed app URL, e.g. https://vsquare-review.netlify.app">
    <button onclick="make()">Update</button>
    <button onclick="print()">Print</button>
  </div>

  <div class="poster">
    <div class="logo"><span class="mark">V²</span>VSQUARE GAMING</div>
    <h2>GG! Rate your session</h2>
    <div class="stars">★★★★★</div>
    <div id="qr"></div>
    <div><b>Scan to rate us on Google</b></div>
    <div class="small">Takes 30 seconds · No app needed</div>
  </div>

<script>
  const input = document.getElementById("url");
  input.value = new URL("index.html", location.href).href.startsWith("http") ? new URL("./", location.href).href : "";
  function make() {
    const el = document.getElementById("qr");
    el.innerHTML = "";
    if (!input.value) return;
    new QRCode(el, { text: input.value, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M });
  }
  make();
</script>
</body>
</html>
